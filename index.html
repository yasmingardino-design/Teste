<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel de Monitoramento do Motor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-escuro: #0A1F3D;
    --azul: #17335C;
    --azul-suave: #3B5A85;
    --preto: #101214;
    --branco: #FFFFFF;
    --cinza-bg: #F4F6F9;
    --cinza-borda: #E3E7EE;
    --cinza-texto: #6B7482;
    --ok: #2E9E5B;
    --atencao: #C98A1E;
    --critico: #C0392B;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    padding: 40px;
    background: var(--cinza-bg);
    font-family: 'Inter', sans-serif;
    color: var(--preto);
    min-height: 100vh;
  }

  .container{
    max-width: 1000px;
    margin: 0 auto;
  }

  /* ---------- Cabeçalho ---------- */
  .header-row{
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1{
    font-size: 20px;
    font-weight: 700;
    color: var(--azul-escuro);
    margin: 0 0 2px 0;
  }

  .subtitle{
    font-size: 13px;
    color: var(--cinza-texto);
    margin: 0;
  }

  .live-badge{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--azul-escuro);
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    padding: 7px 14px;
    border-radius: 20px;
  }

  .live-dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px rgba(46,158,91,0.15);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  /* ---------- Filtro (chip estilo da imagem de referência) ---------- */
  .filter-block{
    margin-bottom: 22px;
  }

  .filter-label{
    font-size: 11px;
    color: var(--cinza-texto);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .filter-chip{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--branco);
    border: 1px solid var(--azul-suave);
    color: var(--azul-escuro);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
  }

  .filter-chip .close-x{
    color: var(--azul-suave);
    font-weight: 700;
    cursor: default;
    font-size: 13px;
  }

  /* ---------- Cartões de métricas ---------- */
  .cards{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  @media (max-width: 720px){
    .cards{ grid-template-columns: 1fr; }
  }

  .card{
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: 10px;
    padding: 26px 20px 20px 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 1px 2px rgba(16,18,20,0.04);
    border-top: 3px solid var(--azul-escuro);
    transition: border-top-color 0.3s ease;
  }

  .card .status-pill{
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 12px;
    color: var(--branco);
    background: var(--ok);
    transition: background 0.3s ease;
  }

  .card .value-row{
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    margin-bottom: 8px;
  }

  .card .value{
    font-size: 44px;
    font-weight: 800;
    color: var(--azul-escuro);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .card .unit{
    font-size: 16px;
    font-weight: 600;
    color: var(--azul-suave);
  }

  .card .label{
    font-size: 13px;
    color: var(--cinza-texto);
    font-weight: 500;
  }

  .card .bar-track{
    margin-top: 16px;
    height: 6px;
    border-radius: 4px;
    background: var(--cinza-bg);
    overflow: hidden;
  }

  .card .bar-fill{
    height: 100%;
    width: 0%;
    background: var(--azul-escuro);
    border-radius: 4px;
    transition: width 0.6s ease, background 0.3s ease;
  }

  .card .range-row{
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--cinza-texto);
    margin-top: 6px;
  }

  footer{
    margin-top: 26px;
    font-size: 11px;
    color: var(--cinza-texto);
    text-align: right;
  }
</style>
</head>
<body>

  <div class="container">

    <div class="header-row">
      <div>
        <h1>Painel de Monitoramento do Motor</h1>
        <p class="subtitle">Motor Elétrico M-102 · Leituras simuladas em tempo real</p>
      </div>
      <div class="live-badge">
        <span class="live-dot" id="liveDot"></span>
        <span id="liveLabel">Operação normal</span>
      </div>
    </div>

    <div class="filter-block">
      <div class="filter-label">Período de leitura</div>
      <div class="filter-chip">
        Últimas 24 horas
        <span class="close-x">&times;</span>
      </div>
    </div>

    <div class="cards">

      <div class="card" id="cardTemp">
        <span class="status-pill" id="pillTemp">NORMAL</span>
        <div class="value-row">
          <span class="value" id="valTemp">--</span>
          <span class="unit">°C</span>
        </div>
        <div class="label">Temperatura do Motor</div>
        <div class="bar-track"><div class="bar-fill" id="barTemp"></div></div>
        <div class="range-row"><span>20</span><span>110</span></div>
      </div>

      <div class="card" id="cardVib">
        <span class="status-pill" id="pillVib">NORMAL</span>
        <div class="value-row">
          <span class="value" id="valVib">--</span>
          <span class="unit">mm/s</span>
        </div>
        <div class="label">Vibração</div>
        <div class="bar-track"><div class="bar-fill" id="barVib"></div></div>
        <div class="range-row"><span>0</span><span>12</span></div>
      </div>

      <div class="card" id="cardCurr">
        <span class="status-pill" id="pillCurr">NORMAL</span>
        <div class="value-row">
          <span class="value" id="valCurr">--</span>
          <span class="unit">A</span>
        </div>
        <div class="label">Corrente Elétrica</div>
        <div class="bar-track"><div class="bar-fill" id="barCurr"></div></div>
        <div class="range-row"><span>0</span><span>55</span></div>
      </div>

    </div>

    <footer id="updatedAt">Atualizado agora</footer>

  </div>

<script>
  const COLOR = {
    ok: getComputedStyle(document.documentElement).getPropertyValue('--ok').trim(),
    atencao: getComputedStyle(document.documentElement).getPropertyValue('--atencao').trim(),
    critico: getComputedStyle(document.documentElement).getPropertyValue('--critico').trim(),
    azulEscuro: getComputedStyle(document.documentElement).getPropertyValue('--azul-escuro').trim()
  };

  function buildMetric(prefix, min, max, warnFrom, critFrom) {
    return {
      valueEl: document.getElementById('val' + prefix),
      barEl: document.getElementById('bar' + prefix),
      pillEl: document.getElementById('pill' + prefix),
      cardEl: document.getElementById('card' + prefix),
      min, max, warnFrom, critFrom
    };
  }

  const metrics = {
    Temp: buildMetric('Temp', 20, 110, 80, 92),
    Vib:  buildMetric('Vib', 0, 12, 4.5, 7),
    Curr: buildMetric('Curr', 0, 55, 35, 43)
  };

  function updateMetric(m, value) {
    const clamped = Math.max(m.min, Math.min(m.max, value));
    const pct = ((clamped - m.min) / (m.max - m.min)) * 100;

    m.valueEl.textContent = clamped.toFixed(1);
    m.barEl.style.width = pct + '%';

    let status = 'NORMAL', color = COLOR.ok;
    if (clamped >= m.critFrom) { status = 'CRÍTICO'; color = COLOR.critico; }
    else if (clamped >= m.warnFrom) { status = 'ATENÇÃO'; color = COLOR.atencao; }

    m.pillEl.textContent = status;
    m.pillEl.style.background = color;
    m.barEl.style.background = color;
    m.cardEl.style.borderTopColor = color;

    return status;
  }

  let t = 0;
  function simulate() {
    t += 0.12;
    const temp = 64 + Math.sin(t) * 10 + (Math.random() - 0.5) * 4;
    const vib  = 3 + Math.sin(t * 1.4 + 1) * 1.6 + (Math.random() - 0.5) * 0.8;
    const curr = 28 + Math.sin(t * 0.8 + 2) * 8 + (Math.random() - 0.5) * 3;

    const s1 = updateMetric(metrics.Temp, temp);
    const s2 = updateMetric(metrics.Vib, vib);
    const s3 = updateMetric(metrics.Curr, curr);

    const statuses = [s1, s2, s3];
    const liveDot = document.getElementById('liveDot');
    const liveLabel = document.getElementById('liveLabel');

    if (statuses.includes('CRÍTICO')) {
      liveDot.style.background = COLOR.critico;
      liveDot.style.boxShadow = '0 0 0 3px rgba(192,57,43,0.15)';
      liveLabel.textContent = 'Atenção: condição crítica';
    } else if (statuses.includes('ATENÇÃO')) {
      liveDot.style.background = COLOR.atencao;
      liveDot.style.boxShadow = '0 0 0 3px rgba(201,138,30,0.15)';
      liveLabel.textContent = 'Monitorar: valores elevados';
    } else {
      liveDot.style.background = COLOR.ok;
      liveDot.style.boxShadow = '0 0 0 3px rgba(46,158,91,0.15)';
      liveLabel.textContent = 'Operação normal';
    }

    document.getElementById('updatedAt').textContent =
      'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour12: false });
  }

  simulate();
  setInterval(simulate, 1200);
</script>

</body>
</html>
